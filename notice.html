<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notice Board - B.B. High School</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { background-color: #f4f7f6; color: #333; padding-bottom: 30px; }
    
    /* Header */
    .header { background-color: #c0392b; color: white; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; }
    .header h2 { font-size: 20px; }
    .back-btn { background: white; color: #c0392b; border: none; padding: 8px 14px; font-weight: bold; border-radius: 6px; cursor: pointer; text-decoration: none; }

    .container { max-width: 600px; margin: 20px auto; padding: 0 15px; }

    /* Card Styling */
    .card { background: white; border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
    .card h3 { margin-bottom: 15px; color: #c0392b; font-size: 18px; border-bottom: 2px solid #f4f7f6; padding-bottom: 8px; }

    /* Form Inputs */
    .form-group { margin-bottom: 15px; }
    .form-group label { display: block; margin-bottom: 5px; font-weight: bold; font-size: 14px; }
    .form-group input, .form-group textarea, .form-group select { width: 100%; padding: 10px; border: 1px solid #ccc; border-radius: 6px; font-size: 14px; }
    .form-group textarea { resize: vertical; height: 80px; }
    
    .btn-submit { background-color: #27ae60; color: white; border: none; width: 100%; padding: 12px; font-size: 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .btn-submit:hover { background-color: #219150; }

    /* Notice Feed */
    .notice-item { border-left: 4px solid #c0392b; background: #fafafa; padding: 12px 15px; border-radius: 4px; margin-bottom: 12px; }
    .notice-header { display: flex; justify-content: space-between; font-size: 12px; color: #777; margin-bottom: 5px; }
    .notice-title { font-weight: bold; font-size: 16px; color: #2c3e50; margin-bottom: 5px; }
    .notice-desc { font-size: 14px; color: #555; line-height: 1.4; margin-bottom: 8px; }
    .attachment-link { display: inline-block; font-size: 13px; color: #2980b9; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <!-- Top Bar -->
  <div class="header">
    <h2> 📢 Notice Board</h2>
    <a href="teacher_home.html" class="back-btn">⬅ Back</a>
  </div>

  <div class="container">
    
    <!-- 1. Form to Create Notice -->
    <div class="card">
      <h3>write a new notice</h3>
      <form id="noticeForm">
        <div class="form-group">
          <label>notice title</label>
          <input type="text" id="noticeTitle" placeholder="enter Title" required>
        </div>
        
        <div class="form-group">
          <label>Description</label>
          <textarea id="noticeDesc" placeholder="enter full notice.." required></textarea>
        </div>

        <div class="form-group">
          <label>files/photos (Optional)</label>
          <input type="file" id="noticeFile" accept="image/*,application/pdf">
        </div>

        <button type="submit" class="btn-submit">upload</button>
      </form>
    </div>

    <!-- 2. Display Old Notices -->
    <div class="card">
      <h3>old notice (History)</h3>
      <div id="noticeList">
         <a href="view.html" class="back-btn">view</a>
      </div>
    </div>

  </div>

<script type="module">
  import { db } from "./firebase-config.js";
  import { uploadToCloudinary } from "./cloudinaryService.js";
  import { 
    addDoc, serverTimestamp, collection, query, where, getDocs 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

  // 🔐 Firebase Auth Imports
  import { 
    getAuth, onAuthStateChanged 
  } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";

  const auth = getAuth();
  let currentTeacherData = null;

  // 🔒 1. FIREBASE AUTH SESSION CHECK
  onAuthStateChanged(auth, async (user) => {
    if (user) {
      try {
        const q = query(collection(db, "teachers"), where("uid", "==", user.uid));
        const querySnap = await getDocs(q);

        if (!querySnap.empty) {
          currentTeacherData = querySnap.docs[0].data();
        } else {
          window.location.href = "index.html";
        }
      } catch (err) {
        console.error("Auth check error:", err);
      }
    } else {
      // अगर लॉगिन नहीं है तो सीधे लॉगिन पेज पर भेज दो
      window.location.href = "index.html";
    }
  });

  // 2️⃣ 🔔 Netlify Serverless Function के ज़रिए Push Notification भेजना
  async function sendPushNotification(title, desc) {
    try {
      await fetch('/.netlify/functions/send-notice', {
        method: 'POST',
        headers: {
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          title: title,
          body: desc
        })
      });
      console.log("Netlify Push Notification Triggered!");
    } catch (err) {
      console.error("Failed to send Netlify push notification:", err);
    }
  }

  // 3️⃣ Form Submit Logic
  const noticeForm = document.getElementById("noticeForm");

  noticeForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    const user = auth.currentUser;
    if (!user || !currentTeacherData) {
      Swal.fire({
        title: 'Error!',
        text: 'You must be logged in to post a notice.',
        icon: 'error',
        confirmButtonColor: '#b83b19'
      });
      return;
    }

    const noticeTitle = document.getElementById("noticeTitle").value;
    const noticeDesc = document.getElementById("noticeDesc").value;
    const noticeFile = document.getElementById("noticeFile").files[0]; 

    let fileUrl = null;
    let fileType = null;

    try {
      if (noticeFile) {
        fileType = noticeFile.type;
        console.log("Uploading file to Cloudinary...");
        Swal.fire({
          title: 'Uploading to cloud...',
          text: 'Please wait while the file is uploading',
          allowOutsideClick: false,
          didOpen: () => Swal.showLoading()
        });
        fileUrl = await uploadToCloudinary(noticeFile);
      }

      // 🔥 Firestore Database में नया नोटिस सेव करें
      await addDoc(collection(db, "notices"), {
        title: noticeTitle,
        desc: noticeDesc,
        fileUrl: fileUrl.fileUrl,
        fileType: fileType,
        postedBy: currentTeacherData.fullName || "Teacher",
        postedById: currentTeacherData.teacherId || user.uid,
        timestamp: serverTimestamp()
      });

      // 📢 Netlify बैकएंड के ज़रिए सब डिवाइसों पर नोटिफिकेशन भेजें
      await sendPushNotification(noticeTitle, noticeDesc);

      Swal.fire({
        title: 'Success!',
        text: 'Notice uploaded & notification sent successfully! 🎉',
        icon: 'success',
        confirmButtonColor: '#b83b19'
      });

      noticeForm.reset();

    } catch (error) {
      console.error("Upload error:", error);
      Swal.fire({
        title: 'Error!',
        text: 'Uploading error, please try again!',
        icon: 'error',
        confirmButtonColor: '#b83b19'
      });
    }
  });
</script>

</body>
</html>
